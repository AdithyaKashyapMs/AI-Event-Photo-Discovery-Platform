# Alembic migrations for the backend database.
# The database URL comes from DATABASE_URL (see app/database.py), not this file.
#
#   alembic upgrade head                        # apply migrations
#   alembic revision --autogenerate -m "..."    # after changing app/models.py
#   alembic check                               # fails if models and migrations differ

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
